<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>囲碁 地合目利きクイズ (19路盤)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
  <h2>囲碁 地合目利きクイズ (19路盤)</h2>
  
  <div class="status-bar">
    <span>問題 <span id="problemIdx">--</span> / <span id="problemTotal">--</span></span>
    <span>残りライフ: <span id="lives">3</span></span>
    <span>スコア: <span id="score">0</span></span>
  </div>

  <div id="boardWrap">
    <canvas id="board" width="600" height="600"></canvas>
  </div>

  <div id="status" class="status-msg">ロード中...</div>

  <div class="controls">
    <select id="answerMode">
      <option value="winner">勝敗 + 目数</option>
      <option value="diff">目数差のみ(符号付)</option>
    </select>

    <span id="answerWinnerBox">
      <select id="ansWinner">
        <option value="black">黒勝ち</option>
        <option value="white">白勝ち</option>
      </select>
      <input type="number" id="ansMargin" step="0.5" min="0.5" value="0.5"> 目
    </span>

    <span id="answerDiffBox" style="display:none;">
      黒 − 白 ＝ <input type="number" id="ansDiff" step="0.5" placeholder="0.0"> 目
    </span>

    <button id="submitBtn">答え合わせ</button>
    <button id="restartBtn">リスタート</button>
  </div>

  <div class="meta-footer" id="metaFooter">
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
