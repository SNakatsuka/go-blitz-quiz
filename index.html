<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>囲碁 整地計算トレーニング</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f4f4f4; text-align: center; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 10px; color: #333; }

        /* スコアボード（新設） */
        #gameInfo {
            display: flex; justify-content: space-around; align-items: center;
            background: #eef; padding: 15px; border-radius: 8px; margin-bottom: 20px;
            border: 1px solid #dde;
        }
        .info-box { text-align: center; }
        .info-label { font-size: 0.85rem; color: #666; margin-bottom: 4px; }
        .info-value { font-size: 1.25rem; font-weight: bold; color: #333; }
        .red-text { color: #d00; }

        /* 盤面 */
        canvas { background-color: #d3a052; display: block; margin: 0 auto; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: crosshair; }

        /* 操作パネル */
        .controls { margin-top: 20px; padding: 15px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
        .mode-select { margin-bottom: 15px; }
        .input-group { margin: 15px 0; }
        input[type="number"], select { padding: 10px; font-size: 1rem; border-radius: 4px; border: 1px solid #ccc; width: 80px; text-align: center; }

        /* ボタン */
        .btn { padding: 10px 25px; font-size: 1rem; cursor: pointer; border: none; border-radius: 5px; color: white; transition: background 0.2s; }
        .btn-blue { background-color: #2196F3; } .btn-blue:hover { background-color: #1976D2; }
        .btn-green { background-color: #4CAF50; } .btn-green:hover { background-color: #388E3C; }
        .btn-gray { background-color: #757575; }

        /* 結果表示エリア */
        #resultArea { margin-top: 20px; display: none; }
        .result-box { padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; }
        .status-msg { margin-top: 15px; font-weight: bold; font-size: 1.1rem; min-height: 1.5em; }
        .status-msg.green { color: #2e7d32; }
        .status-msg.red { color: #c62828; }

        /* 答え合わせボタン */
        #btnShowAnswer { width: 100%; margin-top: 10px; background-color: #607d8b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>囲碁 整地計算トレーニング</h1>

        <div style="margin-bottom: 15px;">
            <label>サイズ:
                <select id="boardSizeSelect">
                    <option value="9" selected>9路盤</option>
                    <option value="19">19路盤</option>
                </select>
            </label>
            <span style="margin-left: 15px;">残りライフ: <span id="lives" style="color:red; font-weight:bold;">3</span></span>
            <span style="margin-left: 15px;">スコア: <span id="score" style="font-weight:bold;">0</span></span>
            <span style="margin-left: 15px;">問: <span id="problemIdx">0</span> / <span id="problemTotal">0</span></span>
        </div>

        <div id="gameInfo">
            <div>データを読み込み中...</div>
        </div>

        <canvas id="board" width="600" height="600" role="img" aria-label="囲碁盤の図"></canvas>

        <div class="controls">
            <div class="mode-select">
                回答モード:
                <select id="answerMode">
                    <option value="diff">目数差を入力 (例: 6.5)</option>
                    <option value="winner">勝者と目数を入力</option>
                </select>
            </div>

            <div id="answerDiffBox" class="input-group">
                黒が
                <input type="number" id="ansDiff" step="0.5" placeholder="目数">
                目勝ち
                <br><small style="color:#888;">(白勝ちならマイナスを入力、例: -3.5)</small>
            </div>

            <div id="answerWinnerBox" class="input-group" style="display:none;">
                勝者:
                <select id="ansWinner">
                    <option value="black">黒 (Black)</option>
                    <option value="white">白 (White)</option>
                </select>
                <input type="number" id="ansMargin" step="0.5" min="0" placeholder="目数">
                目勝ち
            </div>

            <button id="submitBtn" type="button" class="btn btn-blue">回答する</button>
            <button id="btnNext" type="button" class="btn btn-blue" style="display:none; margin-left:10px;">次へ</button>
            <div id="status" class="status-msg" aria-live="polite"></div>

            <div id="resultArea"></div>

            <button id="restartBtn" type="button" class="btn btn-green" style="margin-top: 20px;">リスタート</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
