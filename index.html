<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>囲碁 整地計算トレーニング</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>囲碁 整地計算トレーニング</h1>

        <div style="margin-bottom: 15px;">
            <label>サイズ:
                <select id="boardSizeSelect">
                    <option value="9" selected>9路盤</option>
                    <option value="19">19路盤</option>
                </select>
            </label>
            <span style="margin-left: 15px;">残りライフ: <span id="lives" style="color:red; font-weight:bold;">3</span></span>
            <span style="margin-left: 15px;">スコア: <span id="score" style="font-weight:bold;">0</span></span>
            <span style="margin-left: 15px;">問: <span id="problemIdx">0</span> / <span id="problemTotal">0</span></span>
        </div>

        <div id="gameInfo">
            <div>データを読み込み中...</div>
        </div>
        
        <div id="boardWrap">
            <canvas id="board" width="600" height="600" role="img" aria-label="囲碁盤の図"></canvas>
        </div>

        <div class="controls">
            <div class="mode-select">
                回答モード:
                <select id="answerMode">
                    <option value="diff">目数差を入力 (例: 6.5)</option>
                    <option value="winner">勝者と目数を入力</option>
                </select>
            </div>

            <div id="answerDiffBox" class="input-group">
                黒が
                <input type="number" id="ansDiff" step="0.5" placeholder="目数">
                目勝ち
                <div class="note">白勝ちならマイナスを入力（例: -3.5）</div>
            </div> 
            
            <div id="answerWinnerBox" class="input-group" style="display:none;">
                勝者:
                <select id="ansWinner">
                    <option value="black">黒 (Black)</option>
                    <option value="white">白 (White)</option>
                </select>
                <input type="number" id="ansMargin" step="0.5" min="0" placeholder="目数">
                目勝ち
            </div>

            <div class="button-row">
                <button id="submitBtn" class="btn btn-blue">回答する</button>
                <button id="btnNext" class="btn btn-blue" style="display:none; margin-left:10px;">次へ</button>
                <button id="restartBtn" class="btn btn-green">リスタート</button>
            </div>
        
            <div id="status" class="status-msg"></div>
        </div>
        <div id="resultArea"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
