<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>囲碁 BLITZ地合計算 (19路盤)</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
    #game-container { display: inline-block; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    canvas { display: block; margin: 10px auto; background: #d3a052; cursor: crosshair; }
    .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; }
    .status { margin: 15px 0; font-weight: bold; min-height: 1.2em; }
    .green { color: #28a745; } .red { color: #dc3545; }
    .meta { margin-top: 20px; font-size: 0.85em; color: #666; border-top: 1px solid #eee; padding-top: 10px; }
    .label { font-weight: bold; color: #444; }
    .sep { margin: 0 8px; color: #ccc; }
    
    /* 入力エリアのスタイル */
    select, input[type="number"] { padding: 5px; font-size: 16px; width: 80px; }
  </style>
</head>
<body>

<div id="game-container">
  <h2>囲碁 BLITZ地合計算 (19路盤)</h2>
  
  <div style="margin-bottom: 10px;">
    問題 <span id="problemIdx">--</span> / <span id="problemTotal">--</span>
    &nbsp;|&nbsp; 残りライフ: <span id="lives">3</span>
    &nbsp;|&nbsp; スコア: <span id="score">0</span>
  </div>

  <canvas id="board" width="600" height="600"></canvas>

  <div id="status" class="status">ロード中...</div>

  <div class="controls">
    <select id="answerMode">
      <option value="winner">勝敗 + 目数</option>
      <option value="diff">目数差のみ(符号付)</option>
    </select>

    <span id="answerWinnerBox">
      <select id="ansWinner">
        <option value="black">黒勝ち</option>
        <option value="white">白勝ち</option>
      </select>
      <input type="number" id="ansMargin" step="0.5" min="0.5" value="0.5"> 目
    </span>

    <span id="answerDiffBox" style="display:none;">
      黒 − 白 ＝ <input type="number" id="ansDiff" step="0.5" placeholder="0.0"> 目
    </span>

    <button id="submitBtn" style="padding: 5px 20px; font-weight:bold; cursor:pointer;">答え合わせ</button>
    <button id="restartBtn" style="cursor:pointer;">リスタート</button>
  </div>

  <div class="meta" id="metaFooter">
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
